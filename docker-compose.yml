services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "5340:80"
    volumes:
      - seq-data:/data

  api:
    build:
      context: .
      dockerfile: src/Orders.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Orders: "Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__HostName: "rabbitmq"
      Seq__ServerUrl: "http://seq:5341"
    ports:
      - "5080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/Orders.Worker/Dockerfile
    environment:
      ConnectionStrings__Orders: "Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__HostName: "rabbitmq"
      Seq__ServerUrl: "http://seq:5341"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started

volumes:
  rabbitmq-data:
  postgres-data:
  seq-data: